# Proves the rule FIRES. Without these, a typo'd pattern yields a permanently green check
# that inspects nothing — the main failure mode of a lint gate.
id: activation-must-not-touch-secrets
valid:
  # The CLIs are installed, not run — that is the whole point.
  - '{ home.packages = [ secrets-rehydrate secrets-status ]; }'
  # Prose about the commands inside a NON-activation string.
  - '{ home.file.".config/secrets/README".text = "run secrets-rehydrate after gcloud auth login"; }'
  # gcloud is installed as a cask; a cask list is not an activation hook.
  - '{ homebrew.casks = [ "gcloud-cli" ]; }'
  # An activation hook doing ordinary work.
  - '{ home.activation.linkThing = "ln -sfn a b"; }'
invalid:
  # A home-manager activation entry pulling secrets.
  - '{ home.activation.rehydrate = "secrets-rehydrate"; }'
  # A nix-darwin activation script talking to Secret Manager directly.
  - '{ system.activationScripts.postActivation.text = "gcloud secrets versions access latest --secret=x"; }'
  # Logging in during activation is the same class of mistake.
  - '{ system.userActivationScripts.login.text = "gcloud auth login"; }'
  # Even "just checking" is a network call from activation.
  - '{ home.activation.status = "secrets-status"; }'
