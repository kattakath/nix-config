# ACTIVATION ≠ SECRETS — ADR-004's hard rule, mechanised in the style of
# capsule-must-not-reach-out.yml.
#
# `darwin-rebuild switch` (and `home-manager switch`, and any NixOS activation) must NEVER
# call the secrets-* CLIs or `gcloud secrets` / `gcloud auth`. They are operator-invoked:
# they need an interactive SSO session, they write the Keychain or a cloud project, and an
# activation that did either would turn "rebuild my Mac" into "mutate my secrets" with no
# prompt in between. The capsule's own check (keychain-secrets-backend-inert) proves the
# ASSEMBLED home.activation is clean for a fixture; this rule catches the SOURCE text in any
# file, including a host or a shared module the fixture never evaluates.
#
# Scope: a string fragment (a `''…''` script body or a "…" literal) that names one of those
# commands, when it sits inside a binding whose attrpath is an activation hook —
# `home.activation.<x>`, `system.activationScripts.<x>`, `system.userActivationScripts.<x>`.
# The same text in a package (the CLIs themselves), a comment, a README or `home.packages`
# is fine and unflagged.
#
# BLIND SPOTS, stated: a hook that reaches the CLI indirectly (a wrapper script whose name
# does not contain the substring, or `lib.getExe pkgOfSecretsPush`) is not seen. The
# eval-time check above is the second layer for exactly that.
id: activation-must-not-touch-secrets
language: nix
severity: error

rule:
  kind: string_fragment
  regex: '(secrets-(rehydrate|push|resolve|status)|gcloud (secrets|auth))'
  inside:
    kind: binding
    stopBy: end
    has:
      field: attrpath
      regex: '(^|\.)(activation|activationScripts|userActivationScripts)(\.|$)'

message: An activation hook reaches for a secret backend — activation must never touch secrets.
note: |
  secrets-rehydrate / secrets-push / secrets-resolve / secrets-status and `gcloud secrets`
  are OPERATOR-INVOKED, after `gcloud auth login`. Nothing that runs during
  `darwin-rebuild switch` may call them: no home.activation entry, no
  system.activationScripts, no launchd unit started by activation. Rationale + the
  recovery flow that replaces it: docs/secrets-recovery-and-identity-adr.md §2.5 and
  modules/features/keychain-secrets/README.md § Backend.
