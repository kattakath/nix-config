# Guards the crash-safety invariant every hook in .claude/hooks/ relies on and
# which nothing enforced until now: an unexpected error must exit 0 rather than
# wedge the turn. The two SessionStart digests say so in their own headers; the
# PreToolUse guard and the Stop gate leave it implicit, which is worse.
#
# An uncaught throw in a hook is not a soft failure — Claude Code surfaces the
# non-zero exit as a hook error, and for a Stop/PreToolUse hook that means the
# turn or the tool call is blocked with a stack trace instead of a decision.
# JSON.parse is the single likeliest thrower in this codebase: the two gates
# parse untrusted event JSON off stdin, and three of the four parse on-disk state
# files that a crashed earlier run may have left truncated.
#
# Nothing STATICALLY lints these four files (~1.3k lines):
# .github/workflows/claude-config-lint.yml checks agent/command/context
# frontmatter, then runs `.claude/hooks/tests/*.sh` — behavioural case suites
# covering only pretooluse-bash-guard.js and stop-gate.js. The two SessionStart
# digests have no coverage at all, and a throw there is just as fatal.
id: hook-json-parse-must-be-guarded
language: javascript
severity: error

# Scoped to the hooks, not all JS: outside a hook a throwing parse is ordinary
# and correct. Kept as a glob so a NEW hook file is covered automatically.
files:
  - '.claude/hooks/*.js'

# `stopBy: end` walks all the way to the file root, so a parse nested inside a
# helper's try (or a try several blocks up) is accepted.
rule:
  pattern: JSON.parse($$$ARGS)
  not:
    inside:
      kind: try_statement
      stopBy: end

message: Unguarded JSON.parse in a Claude Code hook — a malformed payload would wedge the turn.
note: |
  Wrap it in try/catch and degrade gracefully (`process.exit(0)` for an advisory
  hook, an explicit allow/approve for a gate). Two in-tree shapes to copy:
  .claude/hooks/pretooluse-bash-guard.js parses stdin and `emit("approve")`s on a
  malformed payload; .claude/hooks/stop-gate.js wraps its state-file reads in a
  `readJson(p, fallback)` helper. Decoder for what a hook failure looks like to
  the operator: docs/claude-hook-messages.md.
