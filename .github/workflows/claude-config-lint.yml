# claude-config-lint — validate the repo's .claude/ configuration
#
# Runs @carlrannaberg/cclint over the Claude Code project config so malformed
# agent/command frontmatter, bad CLAUDE.md structure, or invalid config land as
# a red check instead of silently degrading the assistant experience.
#
# Scope note: cclint has four sub-linters (agents, commands, context, settings).
# We run agents + commands + context with --fail-on error. We deliberately do
# NOT run the `settings` sub-linter: cclint's bundled schema (0.2.x) only knows
# the { "type": "command" } hook shape and rejects { "type": "prompt" } hooks,
# which are a current, supported Claude Code feature that .claude/settings.json
# uses (its PreToolUse Write|Edit validator). Running `settings` would fail the
# gate on a linter false positive. Editor-side validation of settings.json is
# instead provided by its "$schema" key (json.schemastore.org). Revisit and add
# `cclint settings` here once upstream recognizes prompt hooks.
#
# Triggers: every PR, every push to main, on demand, and as a reusable workflow
# called by nix-ci.yml (its `gate` needs it).

name: claude-config-lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # CALLED by nix-ci.yml so its `gate` aggregator can NEED this lint. A called job
  # reports as `<caller job> / <job>`, NOT as `Lint .claude config`, so the triggers
  # above stay until the ruleset requires `gate` alone (a deliberate double run).
  workflow_call:

concurrency:
  # `github.workflow` is the CALLER's name when called: the standalone run and the
  # called copy get different groups and cannot cancel each other.
  group: claude-config-lint-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a merge-queue run: the queue would eject the PR.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

# Least-privilege: only needs to read the checked-out tree.
permissions:
  contents: read

jobs:
  cclint:
    name: Lint .claude config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # cclint pinned to an exact published version for reproducible runs.
      - name: Lint agents, commands, and CLAUDE.md context
        run: |
          npx --yes @carlrannaberg/cclint@0.2.10 agents   --fail-on error
          npx --yes @carlrannaberg/cclint@0.2.10 commands --fail-on error
          npx --yes @carlrannaberg/cclint@0.2.10 context  --fail-on error

      # The case suites for every .claude/hooks/*.js hook (bash guard, write-target,
      # Stop gate, digests). The guard's were ORPHANED until
      # 2026-09-15 — written, committed, and run by nothing — which is how the
      # guard came to throw ReferenceError on every call and fail OPEN (a
      # retired rule's code outlived its constants) with no gate noticing.
      # Each suite asserts both halves: the shapes that must BLOCK and the
      # shapes that must stay APPROVED, plus that the hook never crashes
      # (a crash fails open, so "approve" alone is not proof of health).
      # Node is already set up above; the suites need only node + python3,
      # both present on ubuntu-24.04.
      - name: Run the hook case suites
        run: |
          for t in .claude/hooks/tests/*.sh; do
            echo "── $t"
            bash "$t"
          done
