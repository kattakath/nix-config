# gitleaks secret-scanning workflow
#
# Gitleaks scans the full git history (and any new commits / PR diffs) for
# accidentally committed secrets: API keys, tokens, passwords, private keys,
# and hundreds of other credential patterns. It catches mistakes before they
# reach production or public forks.
#
# Runs as nix-ci.yml's `gitleaks` job (gated by `gate`, so on every queue entry and
# fork PR), on a weekly schedule (the heartbeat below), and on demand via
# workflow_dispatch. Full history is checked out (fetch-depth: 0)
# so gitleaks can audit all past commits, not just the latest one.

name: gitleaks

on:
  schedule:
    # Weekly scan — Sunday 02:41 UTC
    # Off the hour: GitHub delays or drops :00 schedules under load (see
    # update-flake-lock.yml); this one's 2026-09-20 run was dropped.
    - cron: "41 2 * * 0"
  workflow_dispatch:
  # CALLED by nix-ci.yml so its `gate` aggregator can NEED this scan (a job can only
  # need jobs of its own workflow). It reports there as `gitleaks / Scan for secrets`.
  workflow_call:
    secrets:
      HC_PING_KEY:
        required: false

concurrency:
  # `github.workflow` is the CALLER's name when called, so a scheduled run and
  # nix-ci's called copy sit in DIFFERENT groups and cannot cancel each other.
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a merge-queue run: the queue would eject the PR.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

# Least-privilege: gitleaks only reads the checked-out history. (The old
# gitleaks-ACTION also needed pull-requests:read to list PR commits over the API;
# the CLI walks the local git history instead, so that grant is gone.)
permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history required — gitleaks walks every commit
          fetch-depth: 0

      # The gitleaks CLI, NOT gitleaks/gitleaks-action.
      #
      # The ACTION is free only for personal accounts: against an organization it
      # hard-fails with "[kattakath] is an organization. License key is required"
      # and demands a paid GITLEAKS_LICENSE. Moving this repo under the org tripped
      # exactly that. The gitleaks BINARY is MIT-licensed and unrestricted — only
      # the wrapper is gated — so run it directly and drop the third-party action
      # (one less supply-chain edge).
      #
      # Pinned to our own flake.lock via `--inputs-from .` BELOW: a bare
      # `nixpkgs#` installable resolves the RUNNER's flake registry (a floating
      # nixpkgs we do not control), never ./flake.lock. Same pattern as
      # nix-ci.yml's yq-go step.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run gitleaks
        # `detect` walks the whole local history (fetch-depth: 0 above);
        # --redact keeps any finding out of the public CI log.
        run: |
          set -euo pipefail
          nix run --inputs-from . nixpkgs#gitleaks -- \
            detect --source . --redact --verbose --exit-code 1

      # Dead man's switch (healthchecks.io, project `fleet`; registry: fleet.heartbeats).
      # SCHEDULE ONLY, on purpose: the check proves the cron still fires, and a
      # manual workflow_dispatch / PR / push run would mask a dead scheduler.
      # `success()` pings OK, `failure()` pings /fail; a CANCELLED run pings neither,
      # so the check goes late instead of lying. The ping key is part of the URL, so
      # it is built here from the secret and the URL is never echoed.
      - name: Heartbeat ping
        if: github.event_name == 'schedule' && (success() || failure())
        env:
          PING_KEY: ${{ secrets.HC_PING_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$PING_KEY" ]; then
            echo "::notice::HC_PING_KEY unset (fork?) - heartbeat skipped"
            exit 0
          fi
          suffix=""
          [ "$JOB_STATUS" = "success" ] || suffix="/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null "https://hc-ping.com/${PING_KEY}/nix-config-gitleaks${suffix}"
