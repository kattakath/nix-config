name: build-installers-impl

# REUSABLE workflow: builds + publishes the ONE prebuilt artifact to the rolling
# installer-latest GitHub release — the LIVE nixpi SD image. Called ONLY by
# build-installers.yml, and ONLY when its `gate` job decides the image changed.
# Nothing triggers this file directly — `on: workflow_call` means it never appears
# as its own run in the Actions list.
#
# WHY A REUSABLE WORKFLOW. The build must be SKIPPED wholesale when the gate says
# nothing changed (the cold RPi kernel — see build-installers.yml's gate). Isolating
# the write-token'd build in its own called workflow lets the caller gate it with a
# single `if:` on ONE job (`installers`), and keeps the build steps reusable.
#
# GITHUB-HOSTED (ubuntu-24.04-arm). Runs on a free-for-public-repo hosted ARM runner
# — THIS repo's CI targets no self-hosted runner, by choice (the Mac's six lanes serve
# other orgs; see nix-ci.yml header). The heaviest
# job (cold RPi kernel, ~1h) fits inside hosted's 6h limit, and Cachix serves the
# warmed closure so it is usually minutes. Hosted lacks Nix + the substituter, so this
# workflow installs them (install-nix-action + cachix-action, same pins as build-installers.yml / gitleaks.yml; nix-ci.yml runs Determinate Nix since 2026-09-21).
#
# CACHIX — WARM the toplevel, EXCLUDE the image. cachix-action pushes the paths
# realised during the build, so a real `nixos-rebuild switch --flake .#nixpi` on the
# Pi 4 SUBSTITUTES the custom RPi kernel + unfree bits instead of building them. But
# the finished multi-GB IMAGE ships via the Release (a `dd`-able artifact belongs
# there, not in the 5 GB Cachix tier), so `pushFilter` keeps it OUT of the push.
# Writes need CACHIX_AUTH_TOKEN (a repo secret); this workflow is push-to-main /
# workflow_dispatch only (never a fork PR), so the token is always available.
#
# NOTE (operational): building the ~5.7 GB decompressed sdImage needs runner disk
# headroom — hosted ubuntu-24.04-arm has ~14 GB free on / plus a larger /mnt; if a run
# ever dies on ENOSPC, point the Nix build tmp at the roomier volume.

on:
  workflow_call:

# READ-ONLY by default; the Release upload's `contents: write` is scoped to the
# build job only (and is capped by the caller's own grant).
permissions:
  contents: read

jobs:
  build:
    name: build (nixpi-sd-img)
    # The ONLY job that writes GitHub state (the installer-latest Release upload).
    # attestations + id-token are for actions/attest-build-provenance below, and are
    # the MINIMUM it needs: id-token mints the OIDC token proving the build came from
    # this workflow on this repo, attestations writes the signed statement to GitHub's
    # attestation store. Neither grants any other reach.
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # UPSTREAM Nix + the kattakath substituter (same pins as build-installers.yml, kept
      # inline to match build-installers' own self-consistent pin choice).
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://kattakath.cachix.org
            extra-trusted-public-keys = kattakath.cachix.org-1:y/w6wnb4ZArdlbfWJ82c81uCXeYgG/sGDUYCszavmEw=

      # Push the build's realised closure to kattakath, EXCEPT the finished image
      # (it ships via the Release). pushFilter drops the sd-image .img* — so the
      # nixpi toplevel/kernel is warmed but the dd-able artifact stays out of the tier.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kattakath
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: "(-nixos-sd-image-|\\.img)"

      - name: Stage tree (git purity)
        run: git add -A

      - name: Build the nixpi SD image (for the Release)
        # -L / --print-build-logs surfaces builder stderr directly in the CI log, so a
        # failing derivation (e.g. the RPi kernel modules-shrunk) is diagnosable without
        # a separate `nix log` on the runner.
        run: nix build .#packages.aarch64-linux.nixpi-sd-image --out-link result --print-build-logs

      # ---- NAME THE ASSET AFTER THE nix-config COMMIT THAT BUILT IT ---------------
      # NOTHING in the image's own filename comes from this repo. `sdImage.imageName`
      # is `"${imageBaseName}-${system.nixos.label}-${system}.img"` (the pinned
      # raspberry-pi-nix `sd-image/sd-image.nix:38-40` — NOT nixpkgs' newer
      # `image.fileName`), and that label is nixpkgs' own `.version` plus the PINNED
      # NIXPKGS commit date and short rev. Measured on revisions ec834e4 and a37c7e05:
      # same flake.lock, DIFFERENT drvPaths, IDENTICAL imageName. Since installer-latest
      # is a rolling slot whose "Retire stale" step below deletes the previous asset,
      # a downloaded image's provenance was unrecoverable once it rolled.
      #
      # WHY THE REVISION IS APPLIED HERE AND NOT DECLARED IN NIX. Both upstream options
      # were measured and both cost more than the filename buys:
      #   * `system.nixos.tags = [ "cfg-<rev>" ]` feeds `system.nixos.label`, which is
      #     in the SYSTEM CLOSURE. The nixpi toplevel drvPath moved on every tag change
      #     (5rh1m306… -> sg54g5n6… -> 0cljs1q1…), so EVERY commit — including ones
      #     touching nothing the Pi runs — would change the nixpi system and present as
      #     a pending deploy.
      #   * `sdImage.imageBaseName` leaves the toplevel alone (verified: 5rh1m306…
      #     unchanged across two different base names) but moves the IMAGE drvPath
      #     (yfrqi3c7… -> 69b9cgbh…) — which is precisely build-installers.yml's gate
      #     key. That gate skipped 22 of the last 25 runs; with a per-commit rev in the
      #     image derivation it would skip NONE, turning routine `modules/home/**` and
      #     `modules/parts/**` pushes into full image builds plus 1.7 GB Release
      #     re-uploads. Defeating a guard built for that exact cost, to label a file, is
      #     a net loss.
      # A commit is metadata about the PUBLISH, not about the content, so it belongs on
      # the published asset rather than inside a content-addressed derivation. It also
      # reads more honestly here: when the gate skips, the release keeps the old asset
      # under the old commit — which IS the commit that built those bytes.
      #
      # THE PREFIX AND EXTENSION ARE PRESERVED, deliberately: both consumers select on
      # them and neither changes. The retire step below matches
      # `^nixos-sd-image-.*\.img(\.zst)?$`, and nixpi-flash matches
      # `^nixos-sd-image-.*\.img\.zst$` then takes `sort_by(.updatedAt) | last`
      # (packages/nixpi-provision.nix). Verified against the new shape, including the
      # counterfactual: ordering those names LEXICALLY picks the wrong one, which is the
      # #248 lockout — never reintroduce a lexical pick.
      - name: Stage the image under its nix-config revision
        run: |
          set -euo pipefail
          shopt -s nullglob
          imgs=(result/sd-image/*.img*)
          if [ "${#imgs[@]}" -ne 1 ]; then
            echo "Expected exactly one built image under result/sd-image, found ${#imgs[@]}." >&2
            exit 1
          fi
          src="${imgs[0]}"
          base="$(basename "$src")"
          # Split at the FIRST `.img` so both `.img` and `.img.zst` round-trip. The
          # literal `nixos-sd-image-` prefix contains no `.img`, so this cannot cut there.
          stem="${base%%.img*}"
          ext="${base#"$stem"}"
          name="${stem}-cfg-${GITHUB_SHA:0:7}${ext}"
          mkdir -p upload
          # HARDLINK, falling back to a copy only when the link is impossible (a
          # separately-mounted /nix, or protected_hardlinks refusing a root-owned store
          # file). The asset is ~1.7 GB and this runner's root volume has ~14 GB free, so
          # a copy is affordable but not free — see this file's header note on ENOSPC.
          ln "$src" "upload/$name" 2>/dev/null || cp "$src" "upload/$name"
          test -s "upload/$name"
          echo "Staged $base as $name"

      # softprops/action-gh-release UPLOADS by filename but does not remove older
      # assets when the nixos-sd-image-*.img.zst basename changes (nixpkgs rev in
      # the name). installer-latest is a single rolling slot — leave only the new
      # image so `nixpi-flash --release` cannot pick a stale pubkey-bearing image
      # via glob order. Non-sd-image assets (if any) are left alone.
      - name: Retire stale nixpi SD image assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No release yet (first publish) ⇒ nothing to retire.
          if ! gh release view installer-latest --json assets >/dev/null 2>&1; then
            echo "No installer-latest release yet; skip retire."
            exit 0
          fi
          gh release view installer-latest --json assets --jq '
            .assets[]
            | select(.name | test("^nixos-sd-image-.*\\.img(\\.zst)?$"))
            | .apiUrl
          ' | while IFS= read -r url; do
            [ -n "$url" ] || continue
            echo "Deleting stale asset: $url"
            gh api -X DELETE "$url"
          done

      # ---- provenance: sign WHAT WE BUILT, before it is published ------------------
      # The flash path was `gh release download` -> `zstd -d` -> `dd` with NO integrity
      # check of any kind. CLAUDE.md's "verified dd" verifies the WRITE (the byte count),
      # not the ARTIFACT — a different thing, and easy to read as cover for this gap.
      #
      # This signs the image with a GitHub-issued OIDC identity so `gh attestation verify`
      # on the operator's Mac can prove the bytes came from THIS workflow in THIS repo.
      # nixpi-flash now refuses to decompress without that proof.
      #
      # Chosen over a SHA256SUMS file beside the asset: sums uploaded to the same release
      # are self-attesting — anyone who can replace the image can replace the sums. An
      # attestation is signed by an identity the attacker does not hold. First-party
      # action, free on public repos.
      #
      # BEFORE the upload on purpose: an unattested asset should never be reachable, not
      # even briefly.
      - name: Attest the SD image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: upload/*.img*

      - name: Publish to installer-latest release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: installer-latest
          name: "nixpi SD image (latest)"
          body: |
            Rolling prebuilt fleet artifact, last built from `${{ github.sha }}`.

            | Asset | Architecture | Use |
            |---|---|---|
            | `nixos-sd-image-*-cfg-<rev>.img.zst` | aarch64-linux (RPi 4) | LIVE nixpi system (not an installer). The `cfg-<rev>` suffix is the nix-config commit that built it (the rest of the name is nixpkgs'). `nix run github:kattakath/nix-config#nixpi-flash -- --disk /dev/diskN --release` flashes THIS + plants the token/Wi-Fi. Secret-free: token + Wi-Fi land on the FIRMWARE partition post-flash. |
          prerelease: true
          make_latest: false
          files: upload/*.img*
