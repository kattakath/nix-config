name: warm-nixpi-cache

# WARM THE LIVE nixpi CLOSURE INTO CACHIX — so nothing ever builds it on the Pi.
#
# THE PROBLEM THIS SOLVES. `nixpi` is a Pi 4 on an SD card. Building a generation
# on it is slow, and a power cut mid-build corrupts the card — which needs physical
# proximity to reflash (docs/nixpi-sd-flashing-runbook.md, ~40 min), defeating the
# whole remotely-managed design. So the Pi must only ever SUBSTITUTE a closure
# someone else built.
#
# The Mac cannot be that someone reliably: nixpkgs' caddy module realises a
# `Caddyfile-formatted` derivation whose builder runs `cp --no-preserve=mode` into
# $out, and that ONE operation EPERMs on Determinate's native Linux builder
# (measured 2026-09-15: `cat >`, `install -m` and `cp`+`chmod` all succeed there —
# only `--no-preserve=mode` fails). So a Mac-side realisation of any Caddy-serving
# nixpi generation dies, and the tempting fallback is `--build-host nixpi`, i.e.
# building on the Pi. That fallback is blocked by .claude/hooks/pretooluse-bash-guard.js.
#
# THE FIX IS THIS JOB. A real aarch64 Linux runner (where that `cp` works) builds
# the toplevel and cachix-action pushes the closure. Afterwards BOTH the Mac and the
# Pi substitute it and neither builds anything — the EPERM never enters the path.
#
# WHY NOT just reuse build-installers. That workflow already warms the closure, but
# only as a side effect of building the ~5.7 GB sdImage for the Release, and only on
# ITS path filter. Warming must fire on EVERY input to the nixpi closure (a one-line
# `sites/**` copy edit changes Caddy's vhost root and therefore the closure), and a
# multi-GB image rebuild + Release re-upload is far too heavy a price for that. So
# the two concerns are split: this job warms (cheap, broad trigger), build-installers
# publishes the dd-able image (heavy, narrow trigger, drvPath-gated).
#
# WHY NO drvPath GATE HERE. build-installers gates because a no-op there re-uploads
# multi-GB Release assets. This job uploads nothing and pushes only paths Cachix does
# not already hold, so an unchanged closure costs one runner spin-up and a no-op
# push. A gate would add more machinery than it saves.
#
# THE NEGATIVE-CACHE TRAP, because it makes a WARMED cache look broken. If you
# evaluate a nixpi change locally BEFORE this job has pushed it, Nix records the 404
# in its narinfo negative cache for an hour (`narinfo-cache-negative-ttl`, default
# 3600). For that hour the Mac keeps planning a BUILD — and hitting the caddy EPERM —
# even though Cachix now has the path. It is not a broken cache and not a reason to
# build on the Pi: wait it out, or re-run with
# `--narinfo-cache-negative-ttl 0`.

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "hosts/nixpi.nix"
      - "modules/nixos/**"
      - "modules/shared/**"
      # The flake ENGINE composes the host: modules/parts/identity.nix carries
      # config.fleet.hostedSites (the real vhost list, folded in when nix-personal
      # was retired 2026-09-15) and hosts.nix/compose.nix make the mkNixos call.
      - "modules/parts/**"
      # cloudflared-connector + firmware-secrets are imported by hosts/nixpi.nix.
      - "modules/features/**"
      # Served site trees: `hostedSites[].root` is a DIRECTORY path literal, so
      # every byte lands in the live closure (.claude/rules/store-copied-trees.md).
      - "sites/**"
      # Baked in as users.users.<login>.openssh.authorizedKeys.
      - "secrets/operator-key.nix"
      - ".github/workflows/warm-nixpi-cache.yml"
  workflow_dispatch:

# Warming is idempotent and cheap; a superseding push makes an in-flight warm
# pointless, so cancel it rather than pushing a closure nobody will deploy.
concurrency:
  group: warm-nixpi-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    name: warm (nixpi toplevel)
    runs-on: ubuntu-24.04-arm # native aarch64-linux: builds what the Pi runs
    # Cold RPi kernel is the worst case; a warmed closure is minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # DETERMINATE Nix, same pin as nix-ci.yml (2026-09-21) — lazy trees +
      # parallel eval on the toplevel eval, and the same Nix the Pi runs.
      #
      # install.determinate.systems: the nixpi closure includes Determinate Nix
      # (modules/parts/compose.nix wires determinate.nixosModules.default into
      # every NixOS host). That package is prebuilt ONLY there — a MISS on
      # cache.nixos.org and Cachix — so without this substituter the runner
      # compiles Nix from C++ source on every warm. Same URL + key the NixOS
      # hosts themselves use (modules/shared/nix-cache.nix). Determinate Nix
      # lists it as a TRUSTED substituter but not an active one, so the line
      # is still needed.
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
        with:
          extra-conf: |
            extra-substituters = https://kattakath.cachix.org https://install.determinate.systems
            extra-trusted-public-keys = kattakath.cachix.org-1:y/w6wnb4ZArdlbfWJ82c81uCXeYgG/sGDUYCszavmEw= cache.flakehub.com-3:hJuILl5sVK4iKm86JzgdXW12Y2Hwd5G07qKtHTOcDCM=

      # No pushFilter: unlike build-installers there is no dd-able image here, so
      # everything realised belongs in the cache.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kattakath
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Flakes evaluate the git tree, not the worktree (.claude/rules/git-purity.md).
      - name: Stage tree (git purity)
        run: git add -A

      - name: Build the nixpi toplevel
        id: build
        run: |
          out=$(nix build .#nixosConfigurations.nixpi.config.system.build.toplevel \
            --no-link --print-build-logs --print-out-paths)
          echo "out=$out" >> "$GITHUB_OUTPUT"

      # This workflow exists to guarantee ONE property: the Pi can substitute
      # rather than build. Building proves it was MADE, not that Cachix received
      # it — the push is cachix-action's implicit post step, and nothing here
      # asserted it landed. A silent push failure leaves a GREEN run that
      # authorises a deploy, the Mac then plans a build, hits the documented
      # caddy EPERM on the native Linux builder, and the tempting fallback is
      # building on the Pi: hazard #1, the physical-reflash one. Worse, the repo
      # already documents a DIFFERENT, benign cause for the same symptom (the 1h
      # narinfo negative cache), which trains the operator to wait it out.
      - name: Verify the closure is actually substitutable from Cachix
        run: |
          out='${{ steps.build.outputs.out }}'
          if ! nix path-info --store https://kattakath.cachix.org "$out" >/dev/null 2>&1; then
            echo "::error::$out is NOT in Cachix — the Pi would have to BUILD it." >&2
            echo "The build succeeded but the push did not land. Check CACHIX_AUTH_TOKEN." >&2
            exit 1
          fi
          echo "substitutable: $out"
