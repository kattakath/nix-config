# Claude Code Action — owner-only, comment-triggered, hardened.
#
# WHY THIS SHAPE (public repo, single maintainer `ismailkattakath`):
#   * Comment-driven only. We deliberately do NOT auto-run on `pull_request: opened`.
#     A fork PR can carry a malicious diff / prompt-injection payload; auto-running on
#     it would hand an untrusted actor a Claude turn with repo write scope. Requiring an
#     explicit `@claude` mention keeps the trigger surface minimal.
#   * Maintainer-only gate. The job `if:` requires BOTH `@claude` in the comment body AND
#     the commenter being the maintainer's LOGIN, compared literally. On a public repo
#     anyone can comment `@claude`, so the login check is what actually stops third
#     parties from spending our API budget or steering Claude. It deliberately does NOT
#     compare against `github.repository_owner`: the repo lives under the `kattakath`
#     org while the maintainer's login is `ismailkattakath`, so the owner comparison
#     silently skipped every legitimate mention (measured 2026-09-05 on PR #434 — 👀
#     reaction from the App, then `skipped`). `issue_comment` and
#     `pull_request_review_comment` expose the same `.comment.body` /
#     `.comment.user.login` payload paths, so one condition covers both triggers.
#   * SHA-pinned action. `anthropics/claude-code-action` is pinned to a commit SHA for a
#     release >= v1.0.94 — the release that patched the disclosed prompt-injection /
#     secret-exfiltration vulnerability. A floating `@v1`/`@beta` tag is mutable and could
#     silently ship a regression or a compromised ref; matches this repo's SHA-pin
#     convention (`owner/action@<sha> # vX.Y.Z`).
#   * Hardening: least-privilege top-level `permissions:` (only what the action needs);
#     `show_full_output` left at its default (false) so tool output / tokens are not
#     exposed in this repo's public Actions logs; no `allowed_bots: '*'`; the action is
#     never fed an untrusted PR head checked out into the workspace root.
#
# INERT UNTIL the maintainer completes TWO manual prerequisites (Claude/Nix/git never
# touch the token — mirrors the CACHIX_AUTH_TOKEN secret-only model):
#   1. Add `CLAUDE_CODE_OAUTH_TOKEN` as a repo Actions secret — generate it locally with
#      `claude setup-token` (Claude Pro/Max; non-expiring), then add under Settings ->
#      Secrets and variables -> Actions. Auth uses the Claude subscription, not a
#      metered API key.
#   2. Install the Claude GitHub App on this repo (https://github.com/apps/claude) so
#      `@claude` mentions are delivered to this workflow.
# Until both are done, this workflow simply never does anything.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Top-level permissions. `contents: write` is a DELIBERATE loosening (2026-09-05):
# with `read` the action could only reply with suggested patches, never commit them,
# which made "@claude fix it" a dead end. `write` lets it push fixes to PR branches.
# Accepted tradeoff on this public repo: the maintainer-login gate above is the sole
# trigger path, so only self-invited runs ever get that scope — but a prompt-injection
# payload inside a PR the maintainer @claude's at could now produce pushes, so treat
# @claude on third-party diffs with care. `issues`/`pull-requests: write` (post
# replies), `id-token: write` (OIDC the action uses for auth). Nothing broader.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    # Maintainer-only + @claude gate (literal login — see the header for why NOT
    # repository_owner). Both events share these payload paths.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == 'ismailkattakath'
    runs-on: ubuntu-latest
    steps:
      - name: Run Claude Code
        uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1.0.213
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No `prompt:` — for comment triggers the action responds to the @claude
          # mention. show_full_output / allowed_bots intentionally left at defaults.
