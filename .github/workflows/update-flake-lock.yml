name: update-flake-lock

# Automated flake-input freshness — the FlakeHub "keep your inputs fresh" best
# practice (https://docs.determinate.systems/flakehub/best-practices/).
#
# This is the SCHEDULED counterpart to the manual `/update-input` command: every
# Monday it runs `nix flake update`, regenerates flake.lock, and opens a PR with
# the bump. Dependabot (`.github/dependabot.yml`) covers GitHub Actions but has
# no Nix ecosystem, so flake inputs were previously bumped only by hand — this
# closes that gap.
#
# WHY A GITHUB APP (not the default GITHUB_TOKEN): PRs opened by the built-in
# GITHUB_TOKEN cannot trigger other workflows (a GitHub safeguard against
# recursive CI), so nix-ci would NOT auto-run on the bump PR — defeating the
# point of an automated lockfile bump you still want evaluated before merge. A
# dedicated GitHub App mints a SHORT-LIVED installation token at run time
# (create-github-app-token below); PRs it opens trigger nix-ci normally, and
# nothing long-lived or personal is stored (matches the repo's OIDC posture).
#
# The App is the ONE org-wide CI App (org variable + org secret, see
# docs/flakehub-input-freshness.md § Setup). If either is missing the token step
# fails fast and no PR is cut — the scheduled run simply no-ops.

on:
  schedule:
    # Mondays 04:23 UTC — same weekly cadence as the dependabot actions group,
    # staggered so the two bump PRs don't land at the same minute.
    #
    # OFF the hour on purpose. GitHub: the schedule event "can be delayed during
    # periods of high loads … High load times include the start of every hour.
    # If the load is sufficiently high enough, some queued jobs may be dropped."
    # At :00 this run started 0.5-6h late every week (07-13 to 09-14) and was
    # dropped outright on 2026-09-21, together with gitleaks' 09-20 run.
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  # Never cut two lockfile PRs in parallel; a newer run supersedes an older one.
  group: update-flake-lock
  cancel-in-progress: true

# GITHUB_TOKEN permissions are moot here — the App token below carries the
# push/PR rights — but scope the default token to read-only defensively.
permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Mint a short-lived installation token from the GitHub App. Its client id lives
      # in an org Variable, its signing key in an org Secret (see the header
      # comment / docs). Outputs `token`, used by checkout + update-flake-lock so
      # the resulting PR is authored by the App and DOES trigger nix-ci.
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
          # Least privilege (zizmor github-app): without permission-* inputs the token
          # carries the App's WHOLE installation grant. Pushing the bump branch needs
          # contents, opening + labelling + arming the PR needs pull-requests.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      # UPSTREAM Nix, matching flakehub-publish.yml (nix-ci.yml / warm-nixpi-cache.yml
      # run Determinate Nix since 2026-09-21; `nix flake update` gains nothing from
      # parallel eval, so this job stays on the upstream-compatibility side).
      #
      # access-tokens: `nix flake update` re-resolves every unpinned `github:`
      # input's HEAD via the GitHub REST API (unlike a plain eval/build, which
      # only fetches already-locked revs). Anonymous calls share the 60/hr rate
      # limit across the whole GitHub Actions runner IP pool; an authenticated
      # token — even one scoped to a different repo, like this App's — reads
      # public-repo metadata at the 5000/hr authenticated rate instead.
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ steps.app-token.outputs.token }}

      # Compute every root input EXCEPT the held-back ones at runtime
      # (self-maintaining — a newly added input is included automatically,
      # nothing to remember to update here) and pass that explicit allowlist
      # to update-flake-lock's `inputs:`.
      #
      # nixos-hardware is held back: it carries the LIVE Pi's
      # kernel (raspberry-pi/common/kernel.nix pins one linux-rpi tag), so a weekly
      # bump would move nixpi's kernel unannounced and cost a cold kernel build in
      # warm-nixpi-cache. Kernel moves are deliberate: `/update-input nixos-hardware`
      # by hand (flake.nix, its input comment).
      - id: updatable-inputs
        run: |
          inputs=$(jq -r '.nodes[.root].inputs | keys[] | select(. != "nixos-hardware")' flake.lock | tr '\n' ' ')
          echo "list=$inputs" >> "$GITHUB_OUTPUT"

      - id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          inputs: ${{ steps.updatable-inputs.outputs.list }}
          token: ${{ steps.app-token.outputs.token }}
          # Subject per .claude/rules/pr-title.md: the touched components, not `chore:`.
          # A lock-only bump moves every output built from an input, so it names each
          # first-level `nix flake show` category with derivations (lib, identity and
          # templates are input-free data). The squash merge keeps this as the subject.
          pr-title: "darwinConfigurations, nixosConfigurations, packages, apps, checks, devShells, formatter, deploy: bump flake inputs (automated nix flake update)"
          pr-labels: dependencies
          commit-msg: "darwinConfigurations, nixosConfigurations, packages, apps, checks, devShells, formatter, deploy: bump flake inputs"

      # WHY ARMING LIVES HERE AND NOT IN auto-merge.yml. That workflow does fire on
      # this PR, but its `if:` accepts only PRs whose author is `ismailkattakath` —
      # and this one is authored by the CI bot App, so a lockfile bump was never
      # armed: #512, #506, #488 and #487 all sat at autoMerge=false, two merged by
      # hand and two closed unmerged. The one-line alternative — widening that guard
      # to also accept the App's `…[bot]` login — was rejected twice over. The guard
      # exists to keep FORK PRs away from the App-token step, so every extra login
      # listed there loosens a security boundary to fix a problem that is not about
      # authorship; and it would hard-code a bot login that silently stops matching
      # the day the App is renamed (three predecessor Apps were retired in 2026
      # alone), reintroducing exactly this failure with no signal. Arming from inside
      # this job instead reuses the token already minted above, is scheduled-only so
      # a fork can never reach it, and cannot be broken by a later edit to that
      # guard. Squash is the only method the `main` ruleset allows. The `if:` is the no-op case: when every input was
      # already fresh the action opens no PR and emits an empty number, so the step
      # skips instead of failing the scheduled run.
      - name: Arm auto-merge on the bump PR
        if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        run: gh pr merge --squash --auto "$PR_NUMBER"

      # Dead man's switch (healthchecks.io, project `fleet`; registry: fleet.heartbeats).
      # SCHEDULE ONLY, on purpose: the check proves the cron still fires, and a
      # manual workflow_dispatch run would mask a dead scheduler.
      # `success()` pings OK, `failure()` pings /fail; a CANCELLED run pings neither,
      # so the check goes late instead of lying. The ping key is part of the URL, so
      # it is built here from the secret and the URL is never echoed.
      - name: Heartbeat ping
        if: github.event_name == 'schedule' && (success() || failure())
        env:
          PING_KEY: ${{ secrets.HC_PING_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$PING_KEY" ]; then
            echo "::notice::HC_PING_KEY unset (fork?) - heartbeat skipped"
            exit 0
          fi
          suffix=""
          [ "$JOB_STATUS" = "success" ] || suffix="/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null "https://hc-ping.com/${PING_KEY}/nix-config-update-flake-lock${suffix}"
