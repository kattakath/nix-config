# ADR-011 step 11: copy yesterday's KPI aggregates from Grafana into the history Sheet.
#
# Grafana keeps 14-31 days; the Sheet is the long-term STORE (never a chart), and Grafana
# reads it back with its Sheets datasource. Auth, both short-lived or read-only:
#   Google: Workload Identity Federation (infra/gcp/foundation.nix). Only this repo's
#           main branch is accepted; no key exists for the writer.
#   Grafana: a Viewer service-account token (secret GRAFANA_ROLLUP_TOKEN).
# Per-person values (the Sheet id, the WIF provider and writer names) are repository
# VARIABLES, not file content (the no-data rule).
name: grafana-rollup

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC: yesterday is complete, and off the top of the hour
  workflow_dispatch:
    inputs:
      date:
        description: "Day to roll up, YYYY-MM-DD (default: yesterday, UTC)"
        required: false

permissions:
  contents: read
  id-token: write # the OIDC token WIF exchanges

concurrency:
  group: grafana-rollup
  cancel-in-progress: false

jobs:
  rollup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.ROLLUP_WIF_PROVIDER }}
          service_account: ${{ vars.ROLLUP_WRITER_SA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
      - name: Roll up one day
        env:
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_ROLLUP_TOKEN }}
          SHEET_ID: ${{ vars.ROLLUP_SHEET_ID }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          ROLLUP_DATE: ${{ inputs.date }}
        run: python3 scripts/grafana-rollup.py

      # Dead man's switch (healthchecks.io, project `fleet`; registry: fleet.heartbeats).
      # SCHEDULE ONLY, on purpose: the check proves the cron still fires, and a
      # manual workflow_dispatch run would mask a dead scheduler.
      # `success()` pings OK, `failure()` pings /fail; a CANCELLED run pings neither,
      # so the check goes late instead of lying. The ping key is part of the URL, so
      # it is built here from the secret and the URL is never echoed.
      - name: Heartbeat ping
        if: github.event_name == 'schedule' && (success() || failure())
        env:
          PING_KEY: ${{ secrets.HC_PING_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$PING_KEY" ]; then
            echo "::notice::HC_PING_KEY unset (fork?) - heartbeat skipped"
            exit 0
          fi
          suffix=""
          [ "$JOB_STATUS" = "success" ] || suffix="/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null "https://hc-ping.com/${PING_KEY}/nix-config-grafana-rollup${suffix}"
