name: nix-ci

# Self-owned, native multi-system Nix CI.
#
# LEAN MERGE CI: this workflow does NOT build the host system toplevels
# (macos / nixpi / nixvm). Building them — especially the cold linux-rpi
# kernel — is a RELEASE-time concern handled later against
# `nixosConfigurations.*` / `darwinConfigurations.*` directly. Per PR, we:
#
#   1. BUILD the flake's lint/format checks (`.#checks.<system>` = formatting +
#      pre-commit) once per SYSTEM on that system's own native runner, and
#   2. EVALUATE each host config's toplevel (cheap: forces full module eval,
#      catching config/option/type errors) WITHOUT building it.
#
# ONE LEG PER HOST SYSTEM, on its arch-native GitHub-HOSTED runner:
#   aarch64-linux  -> `ubuntu-24.04-arm`
#   aarch64-darwin -> `macos-latest` (Apple Silicon; a free STANDARD runner on a
#                     public repo).
# The LEGS THEMSELVES ARE DERIVED: the `legs` job reads each host
# configuration's OWN system out of the flake and emits the build matrix, so
# neither half of the coverage invariant can rot silently. A leg owning zero
# hosts cannot exist (legs come from hosts); a host owned by no leg HARD-FAILS
# `legs`, because the only hard-coded fact left is the system -> `runs-on`
# lookup, which GitHub owns and the flake cannot tell us. Adding a host to
# modules/parts/hosts.nix therefore either lands on an existing leg or stops CI
# until someone names its runner.
#
# ALL-HOSTED BY CHOICE. No leg of THIS repo's CI targets a self-hosted runner —
# a statement about this workflow, NOT about the fleet. `macos` runs six
# self-hosted lanes for OTHER consumers: 2 bare-metal (`local.macosGithubRunner`,
# dontsell-ai), 3 ephemeral Tart-VM-per-job (`local.tart.githubRunners.*` — kattakath,
# silvercreek-ai, dontsell-vm), and 1 GitLab (`local.tart.gitlabRunner`); see hosts/macos.nix.
# We stay hosted because hosted native-ARM + macOS STANDARD runners are free &
# unlimited for public repos, Cachix serves the warmed closure so cold builds stay
# fast, and hosted removes both the availability SPOF AND the public-repo fork-PR RCE
# surface (untrusted fork code never lands on our hardware). So every leg installs Nix
# + the kattakath substituter itself — no `runner.environment` guard, no fork-PR runner
# fallback. Day-to-day local aarch64-linux builds use Determinate's native Linux
# builder on the Mac.
#
# READ from the kattakath Cachix cache is public. WRITE needs CACHIX_AUTH_TOKEN,
# and EVERY run that GitHub hands the secret to now writes — same-repo branch PRs
# included, not just push-to-main. The gate is GitHub's, not ours: a
# `pull_request` from a FORK is given no repo secret at all, and a Dependabot PR
# reads a SEPARATE secret store this token is not in. Restricting it to `push` on
# top of that bought no safety and cost a rebuild — measured on PR #550, the PR
# leg built /nix/store/kln8kjyq…-pre-commit-run, was refused (403), and the
# push-to-main leg rebuilt the IDENTICAL path minutes later. The four
# tree-dependent checks (ast-grep, formatting, pre-commit, page-lab) take `self`,
# so every commit re-derives them under a new rev; the PR leg's push is what lets
# the post-merge `push: main` leg substitute the unchanged rest.
#
# The blast radius is unchanged: pushing requires a branch in THIS repo, which
# only the operator can create, and a store path is its own derivation hash — a
# branch cannot overwrite main's content under an existing path.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nix-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Advisory input-freshness gate — the FlakeHub "keep your inputs fresh" best
  # practice (https://docs.determinate.systems/flakehub/best-practices/). Warns
  # (does NOT fail; fail-mode defaults off) on the ROOT `nixpkgs` lock node only
  # (flake-checker never looks at transitive inputs; read from its src/flake.rs
  # 2026-09-21). Since 2026-09-21 that node is a FlakeHub tarball
  # (DeterminateSystems/nixpkgs-weekly): the branch/owner checks no-op on a
  # tarball, but the 30-day staleness check STILL fires on `lastModified`, so
  # the job stays a stale-snapshot alarm if the Monday bump stalls. Deliberately NOT in
  # required-checks' `needs` — it's advisory, pairing with the scheduled
  # update-flake-lock.yml that actually cuts the bump PR.
  flake-checker:
    name: flake-checker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14

  # Derive the build matrix from the fleet, ONCE. The attrs were a hard-coded
  # `matrix.eval-attrs` string per leg, so a host added to modules/parts/hosts.nix
  # was SILENTLY UNTESTED until someone remembered to edit this file too.
  # Deriving the LEGS (not just their attrs) is what closes the other direction:
  # a host whose system no leg claims is a host nothing evaluates, and the
  # runner lookup below turns that into a loud failure instead of a green run.
  #
  # ONE job, not a step inside each leg: the check needs the WHOLE host->system
  # list to know what is unclaimed, which no single leg can see, and asking it
  # per leg would answer it once per leg and duplicate the leg list to compare
  # against.
  #
  # Runs on LINUX, not macOS. Measured 2026-09-22, same job either side: macOS
  # 2m10s (run 35723793664), Linux 49s-1m43s (runs 35750682716 / 35749500311).
  #
  # DO NOT OPTIMISE THIS JOB FURTHER — measured, not assumed. `build` NEEDS its
  # output, so `legs` is the one job every run waits on, which makes it look like
  # the lever. It is not:
  #
  #   * The EVAL is ~3 s. `nix flake show --json --all-systems`, locally, warm
  #     store, `--option eval-cache false`: 2.82 s. There is no expression here
  #     to make faster.
  #   * The CI cost is the COLD-STORE FETCH of the flake's inputs (38-86 s), and
  #     all three jobs pay it INDEPENDENTLY — `legs` is simply the one that pays
  #     it first. Removing it from `legs` moves the tax, it does not remove it.
  #   * A store cache between runs (`nix-community/cache-nix-action`) is the
  #     off-the-shelf answer, and it fails its OWN test here: its README says
  #     "The action may slow down your workflow. You should test whether the
  #     action is useful in your case." Saving/restoring a Nix store through the
  #     GitHub Actions cache is the same order of transfer as the fetch it
  #     avoids — the exact trade `nix-fast-build` was removed for on 2026-09-22
  #     (117 s of tool closure to orchestrate 76 s of work; see the build step).
  #   * `legs` is not the critical path anyway. On run 35750682716 it was 49 s of
  #     ~5m40s; `build (aarch64-darwin)` was 4m45s, of which 61 s is Determinate's
  #     own install on a macOS runner (6 s on Linux — a 10x runner tax no action
  #     of ours controls) and 2m38s is already Cachix-substituted.
  #
  # The one thing that WOULD help is a warm self-hosted runner, and this workflow
  # rejects that deliberately — see the ALL-HOSTED note in the file header.
  #
  # `--all-systems` is what makes the evaluator's own arch irrelevant: it is the
  # flag that stops non-native children coming back as `{"filtered": true}`, in
  # EITHER direction. The guards below are the proof obligation — if a Linux
  # evaluator could not classify `darwinConfigurations`, `macos` comes back with
  # no `forSystems` and the `unclassified` check HARD-FAILS this job. A silent
  # green over a half-covered fleet is not reachable from here.
  legs:
    name: legs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
        with:
          extra-conf: |
            extra-substituters = https://kattakath.cachix.org
            extra-trusted-public-keys = kattakath.cachix.org-1:y/w6wnb4ZArdlbfWJ82c81uCXeYgG/sGDUYCszavmEw=

      # Flakes evaluate the git tree, not the working dir — stage everything
      # BEFORE any nix invocation (see .claude/rules/git-purity.md).
      - name: Stage tree (git purity)
        run: git add -A

      # UPSTREAM FIRST (measured 2026-09-21 under the Determinate Nix pinned
      # above). `nix flake show --json --all-systems` answers this off the shelf:
      # it emits a flake-schemas `inventory` whose host children carry
      # `forSystems`, classified by the CONFIGURATION's own system — measured
      # `nixosConfigurations.nixpi -> ["aarch64-linux"]`,
      # `darwinConfigurations.macos -> ["aarch64-darwin"]` — which is precisely
      # the question asked here, so no hand-written `--apply` expression walks
      # `config.nixpkgs.hostPlatform.system` any more.
      #
      # `--all-systems` is LOAD-BEARING: without it, children belonging to any
      # other system come back as `{"filtered": true}` (measured — both NixOS
      # hosts, on an aarch64-darwin evaluator), so classification would silently
      # follow the RUNNER's arch. This job runs on Linux, so the flag now carries
      # the darwin host too; see the job's header for why that is safe to assert. The `inventory` shape is flake-schemas, which
      # Determinate Nix emits; upstream Nix emits the flat legacy shape with no
      # such key, which parses to ZERO rows (probed). Neither degradation is
      # assumed away — the two guards below fail the job on each, so a revert to
      # cachix/install-nix-action cannot quietly ship a fleet with no legs.
      - name: Derive one leg per host system
        id: derive
        run: |
          set -euo pipefail

          # A TEMP file, not the workspace: this step is also the thing a human runs
          # by hand to debug the matrix, and `> inventory.json` there leaves an
          # untracked file in the repo — which flakes then evaluate around, and which
          # lands in a `git add -A` (measured: it did, on the branch that added this).
          inventory=$(mktemp)
          trap 'rm -f "$inventory"' EXIT
          nix flake show --json --all-systems > "$inventory"

          # `x=$(cmd)` carries the command's exit status, so `set -e` still
          # aborts on a broken eval. `mapfile -t x < <(cmd)` and `cmd | while
          # read` both DISCARD it — never reach for those here.
          rows=$(jq -r '
            def hosts($cat; $suffix):
              (.inventory[$cat].output.children // {})
              | to_entries[]
              | . as $e
              | { name: ($cat + "." + $e.key),
                  attr: (".#" + $cat + "." + $e.key + $suffix),
                  systems: ($e.value.forSystems // []) };
            [ hosts("nixosConfigurations";  ".config.system.build.toplevel.drvPath"),
              hosts("darwinConfigurations"; ".system.drvPath") ][]
            | . as $h
            | if ($h.systems | length) == 0
              then "?\t" + $h.name
              else ($h.systems[] | . + "\t" + $h.attr)
              end
          ' "$inventory")

          if [ -z "$rows" ]; then
            echo "::error::no host configuration found — the inventory shape changed (upstream Nix emits the flat legacy shape) and this job would emit an empty matrix."
            exit 1
          fi
          unclassified=$(printf '%s\n' "$rows" | awk -F'\t' '$1 == "?" { print $2 }')
          if [ -n "$unclassified" ]; then
            printf '::error::host %s carries no forSystems — it would be claimed by no leg.\n' $unclassified
            exit 1
          fi

          # The ONE hard-coded fact: `runs-on` is a per-system GitHub fact, not
          # one the flake can tell us. An unmapped system means a real host that
          # no leg would evaluate, so it stops CI here.
          include='[]'
          for sys in $(printf '%s\n' "$rows" | cut -f1 | sort -u); do
            case "$sys" in
              aarch64-linux)  runner=ubuntu-24.04-arm ;;
              aarch64-darwin) runner=macos-latest ;;
              *)
                echo "::error::host configuration(s) declare system '$sys', which no CI leg claims — add its runner to this lookup."
                exit 1
                ;;
            esac
            attrs=$(printf '%s\n' "$rows" | awk -F'\t' -v s="$sys" '$1 == s { print $2 }' | paste -sd' ' -)
            include=$(printf '%s' "$include" | jq -c --arg n "$sys" --arg r "$runner" --arg a "$attrs" \
              '. + [{ name: $n, "runs-on": $r, "eval-attrs": $a }]')
            echo "leg $sys ($runner): $attrs"
          done

          printf 'matrix=%s\n' "$(printf '%s' "$include" | jq -c '{ include: . }')" >> "$GITHUB_OUTPUT"

  # One leg per host system, on its arch-native runner. fail-fast:false so one
  # leg's failure doesn't cancel the other — the aggregate required-checks
  # job decides the overall result. Each entry is its own status check
  # `build (<name>)`; required-checks is the single stable branch-protection
  # anchor, so renaming/adding legs never requires re-anchoring the ruleset.
  #
  # `matrix.name` is the flake system this leg targets — it titles the check
  # (`build (<system>)`) and selects `.#checks.<system>`; `matrix.eval-attrs`
  # carries the host attrs `legs` derived for it.
  build:
    name: build (${{ matrix.name }})
    needs: [legs]
    runs-on: ${{ matrix.runs-on }}
    # 45, not 30: headroom bought BEFORE ADR-002's collapse lands ~25 absorbed
    # satellite checks on this leg. The failure being avoided is a deadlock, not
    # a slow build — if the budget is breached first, the PR that raises the
    # timeout cannot itself go green. Job names are untouched on purpose:
    # `required-checks` and `Scan for secrets` are named in branch protection, so
    # renaming either silently un-requires it.
    timeout-minutes: 45 # lint + eval only; no toplevel builds
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.legs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # DETERMINATE Nix (2026-09-21; was cachix/install-nix-action, upstream Nix).
      # Every fleet host runs Determinate Nix now, so CI evaluating on upstream Nix
      # tested a Nix nothing runs — and it forwent parallel evaluation + lazy trees,
      # which Determinate's docs put at "5x or more" on exactly this job's work
      # (`nix build` over every `.#checks.<system>.*`, and the two `nix eval`s
      # below — `nix flake show` in `legs` likewise). Free: the action
      # is MIT and needs no FlakeHub login; only FlakeHub Cache (a separate action,
      # deliberately absent) is paid. Flakes are on by default, so no
      # `experimental-features` line. Pinned by commit, like every action here.
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
        with:
          extra-conf: |
            extra-substituters = https://kattakath.cachix.org
            extra-trusted-public-keys = kattakath.cachix.org-1:y/w6wnb4ZArdlbfWJ82c81uCXeYgG/sGDUYCszavmEw=

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kattakath
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Flakes evaluate the git tree, not the working dir — stage everything
      # BEFORE any nix invocation (see .claude/rules/git-purity.md).
      - name: Stage tree (git purity)
        run: git add -A

      # Build this leg's SYSTEM lint/format checks and push to Cachix.
      #
      # PLAIN `nix build`, NOT nix-fast-build (dropped 2026-09-22). The motto cuts
      # both ways — a tool is a violation of it when it is BIGGER THAN THE PROBLEM,
      # not only when it is hand-rolled. `nix run github:Mic92/nix-fast-build/<rev>`
      # fetched 97 paths / 306.8 MiB (1.4 GiB unpacked) on EVERY darwin run to
      # orchestrate 39 checks whose entire build cost on that leg is ~76 s: measured
      # 117 s of a 231 s darwin leg (run 35698919468, merge_group — the queue existed
      # then), i.e. HALF the leg,
      # because it bundles its own `nix` and with it apple-sdk/cctools/ld64. The
      # linux leg pays 108 MiB for the same tool, which is why this only ever read
      # as a darwin problem. Determinate Nix is already installed by the step above,
      # so `nix build` costs no closure at all.
      #
      # GIVEN UP, deliberately: COLLAPSIBLE per-check log groups (`--print-build-logs`
      # still prefixes every line with its derivation), the step-summary report, and
      # `--skip-cached` — a cached check is now SUBSTITUTED rather than skipped.
      # These outputs are `touch $out`-sized, so that trade is bytes, not seconds.
      # KEPT: the gate itself. Every check still builds, and a failure still fails
      # the leg.
      - name: Build lint checks + push to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          SYSTEM: ${{ matrix.name }}
        run: |
          set -euo pipefail

          # ENUMERATED from the flake, never listed here — the same reason `legs`
          # derives its matrix rather than hard-coding it: a check added to
          # modules/parts/checks.nix must not be able to go silently unbuilt.
          # `builtins.attrNames` forces the attrset only, not the 39 derivations
          # inside it, so this is an eval of the checks ATTRSET, not of the checks.
          names=$(nix eval --raw ".#checks.${SYSTEM}" \
            --apply 'cs: builtins.concatStringsSep " " (builtins.attrNames cs)')
          if [ -z "$names" ]; then
            echo "::error::leg '${SYSTEM}' exposes no checks — this gate would build NOTHING while reporting green."
            exit 1
          fi
          attrs=""
          for n in $names; do attrs="$attrs .#checks.${SYSTEM}.$n"; done
          echo "building $(printf '%s' "$names" | wc -w | tr -d ' ') check(s) for ${SYSTEM}"

          # --no-link: a `result` symlink here would be an untracked file in a tree
          # the NEXT step re-evaluates as a flake.
          # Word splitting on $attrs is DELIBERATE: one installable per check.
          # shellcheck disable=SC2086
          paths=$(nix build --no-link --print-out-paths --print-build-logs $attrs)

          # Pushed EXPLICITLY, not by a post-build hook: a hook is a daemon-side
          # setting, and whether a client-set one survives Determinate's daemon on
          # a hosted runner is not something this gate should be quietly betting on.
          # `cachix push` on the paths just built is observable in the log.
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "no CACHIX_AUTH_TOKEN (fork or Dependabot run) — built, not pushed."
            exit 0
          fi
          if ! command -v cachix > /dev/null 2>&1; then
            echo "::error::cachix is not on PATH. cachix-action above installed it, so this is a PATH regression, not a missing token — the push would otherwise be skipped SILENTLY."
            exit 1
          fi
          printf '%s\n' "$paths" | cachix push kattakath

      # EVALUATE (not build) every host config this leg owns. Resolving each
      # toplevel's .drvPath forces a full module-system eval, so a broken config
      # (bad option, type error, missing module) fails CI in seconds — without
      # paying for the actual build. Building is deferred to release / on-machine
      # activation.
      - name: Evaluate host config(s) (no build)
        env:
          # Derived by `legs` from each configuration's own system — never listed.
          EVAL_ATTRS: ${{ matrix.eval-attrs }}
        run: |
          set -euo pipefail

          # `legs` cannot emit an empty leg today, so this is the belt to that
          # derivation's braces: a leg that evaluates nothing is a vacuous gate,
          # green while testing zero hosts. The old `if: matrix.eval-attrs != ''`
          # made exactly that state SKIP silently; it is a hard failure now.
          if [ -z "$EVAL_ATTRS" ]; then
            echo "::error::leg '${{ matrix.name }}' carries no host attrs — it would evaluate nothing."
            exit 1
          fi
          echo "evaluating $(printf '%s\n' $EVAL_ATTRS | wc -l | tr -d ' ') host attr(s) for ${{ matrix.name }}"

          for a in $EVAL_ATTRS; do
            echo "::group::eval $a"
            # NEVER `nix eval … && echo`: POSIX exempts every non-final command
            # of an AND-OR list from errexit, so a failing eval left the loop —
            # and this whole REQUIRED gate — green (measured: run 34006823201
            # printed a `does not provide attribute` error and still passed).
            # Keep the eval a command of its own so `set -e` can see it fail.
            nix eval --raw "$a"
            echo
            echo "::endgroup::"
          done
          echo "✓ host config(s) evaluate."

  # Aggregate gate — the ONE stable-named required check branch protection anchors
  # to. Runs even if a leg fails (if: always()) and fails if any needed job failed,
  # was cancelled, or was SKIPPED. 'skipped' is load-bearing: a failed `legs` does
  # not fail `build`, it skips it, and a skipped job is neither failure nor
  # cancelled — without it this gate would report green over zero legs.
  # Renaming/adding build legs never requires re-anchoring the ruleset.
  required-checks:
    name: required-checks
    needs: [legs, build]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Verify all build legs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "✗ One or more required jobs failed, were cancelled, or were skipped."
            exit 1
          fi
          echo "✓ All build legs passed."
