name: nix-ci

# Self-owned, native multi-system Nix CI.
#
# LEAN MERGE CI: this workflow does NOT build the host system toplevels.
# Building them — especially the cold linux-rpi
# kernel — is a RELEASE-time concern handled later against
# `nixosConfigurations.*` / `darwinConfigurations.*` directly. Per PR, we:
#
#   1. BUILD the flake's checks (`.#checks.<system>` — lint, format, and the
#      eval-only contract checks) on each system's own native runner: linux
#      builds ALL its checks, and so does the advisory darwin leg (who waits on
#      which: WHO WAITS below), and
#   2. EVALUATE each host config's toplevel (cheap: forces full module eval,
#      catching config/option/type errors) WITHOUT building it — on a gated
#      run, the linux leg evaluates every host, macos included.
#
# ONE LEG PER HOST SYSTEM, on its arch-native GitHub-HOSTED runner, each a
# caller of the reusable nix-ci-impl.yml:
#   aarch64-linux  -> `ubuntu-24.04-arm`
#   aarch64-darwin -> `macos-latest` (Apple Silicon; a free STANDARD runner on a
#                     public repo).
# The legs are written out below (the system -> `runs-on` lookup is the one fact
# GitHub owns and the flake cannot tell us), and `legs` VERIFIES them against the
# flake IN PARALLEL: every host configuration's own system must have a leg, and
# every leg must own a host. Adding a host on a new system therefore stops CI
# (via `gate`) until someone names its runner.
#
# WHO WAITS ON WHAT (2026-11-02, the shared kattakath/.github landing system):
#   * `gate` — the aggregator the shared ruleset requires. It needs the HEAVY
#     jobs (legs, aarch64-linux, gitleaks, cclint) and asserts each ended exactly
#     as this event expects, via kattakath/.github/actions/gate.
#   * HEAVY jobs run once per PR: in the merge queue when the repo variable
#     QUEUE_ENABLED is 'true', otherwise on the PR. A FORK PR always runs them on
#     the PR, so a contributor sees a real failure before review.
#   * aarch64-darwin — ADVISORY, on PRs ONLY, whoever wrote it, and NOT in the
#     merge queue (operator decision). Nothing needs it. It runs the FULL darwin
#     leg, and the linux leg still EVALUATES macos on every gated run.
# nix-ci has NO `push: main` run: in the queue, the merge-group commit IS the commit
# main gets, so it is validated BEFORE the merge rather than after.
# Local verification is unchanged: agents still run both systems (CLAUDE.md
# § Testing).
#
# ALL-HOSTED BY CHOICE. No leg of THIS repo's CI targets a self-hosted runner —
# a statement about this workflow, NOT about the fleet. `macos` runs self-hosted
# lanes for OTHER consumers (`local.macosGithubRunner`, `local.tart.githubRunners.*`,
# `local.tart.gitlabRunner`); hosts/macos.nix declares which are enabled.
# We stay hosted because hosted native-ARM + macOS STANDARD runners are free &
# unlimited for public repos, Cachix serves the warmed closure so cold builds stay
# fast, and hosted removes both the availability SPOF AND the public-repo fork-PR RCE
# surface (untrusted fork code never lands on our hardware). So every leg installs Nix
# + the kattakath substituter itself — no `runner.environment` guard, no fork-PR runner
# fallback. Day-to-day local aarch64-linux builds use Determinate's native Linux
# builder on the Mac.
#
# READ from the kattakath Cachix cache is public. WRITE needs CACHIX_AUTH_TOKEN.
# The linux leg writes on every event GitHub hands the secret to EXCEPT
# `merge_group`. With QUEUE_ENABLED on, an own-branch PR skips that leg, so in
# practice the linux leg pushes only on workflow_dispatch; the darwin advisory leg
# still pushes from own-branch PRs.
#   * pull_request: a FORK gets no repo secret, a Dependabot PR reads a separate
#     store this token is not in — so only same-repo branches push.
#   * merge_group: NOT pushed. A queue run executes the queued merge commit, which
#     can contain a fork PR's code, with repo secrets. The leg is passed an EMPTY
#     token there and nix-ci-impl.yml takes its fork path ("built, not pushed").
#     What that costs: the queued commit's `.#checks` outputs only. The closures
#     the fleet substitutes are pushed by warm-nixpi-cache.yml, build-installers
#     and build-devcontainer on push:main. Why no environment-scoped token:
#     docs/auto-merge-and-merge-queue.md § The merge queue.
#
# The blast radius is unchanged: pushing requires a branch in THIS repo, which
# only the operator can create, and a store path is its own derivation hash — a
# branch cannot overwrite main's content under an existing path.

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: nix-ci-${{ github.ref }}
  # Keyed on the EVENT, not the ref: only a superseded PR run cancels. A queue run
  # lives on its own gh-readonly-queue/* ref, and a cancelled queue run EJECTS the
  # PR. (The earlier `ref != main` form made every queue run cancellable.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Advisory input-freshness gate — the FlakeHub "keep your inputs fresh" best
  # practice (https://docs.determinate.systems/flakehub/best-practices/). Warns
  # (does NOT fail; fail-mode defaults off) on the ROOT `nixpkgs` lock node only
  # (flake-checker never looks at transitive inputs; read from its src/flake.rs
  # 2026-09-21). Since 2026-09-21 that node is a FlakeHub tarball
  # (DeterminateSystems/nixpkgs-weekly): the branch/owner checks no-op on a
  # tarball, but the 30-day staleness check STILL fires on `lastModified`, so
  # the job stays a stale-snapshot alarm if the Monday bump stalls. Deliberately NOT in
  # gate's `needs` — it's advisory, pairing with the scheduled
  # update-flake-lock.yml that actually cuts the bump PR.
  flake-checker:
    name: flake-checker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14

  # VERIFY the legs against the fleet — in PARALLEL with them, never in front.
  #
  # No `needs:` edge on purpose: a job that EMITS the matrix queues every leg
  # behind it — measured ~45 s in front of darwin in 40/40 runs
  # (docs/pr-wait-research.md, lever #3). Writing the two legs out and checking
  # them HERE keeps the invariant without the edge. Rejected:
  # keeping the derivation and shrinking the job (its cost is the cold input
  # fetch every job pays, not the ~3 s eval); computing the matrix inside each leg
  # (the leg cannot see the WHOLE host -> system list, so it cannot tell what is
  # unclaimed).
  #
  # The coverage invariant is now SET EQUALITY, checked both ways:
  #   * a host whose system no leg claims  -> HARD FAIL (add its runner);
  #   * a leg whose system owns no host     -> HARD FAIL (a vacuous leg).
  # The leg side is read out of THIS FILE with yq, never restated in bash — a
  # second copy of the leg list is exactly the drift this job exists to catch.
  # `gate` needs this job, so a failure here still blocks merge.
  #
  # Runs on LINUX, not macOS. Measured 2026-09-22, same job either side: macOS
  # 2m10s (run 35723793664), Linux 49s-1m43s (runs 35750682716 / 35749500311).
  #
  # `--all-systems` is what makes the evaluator's own arch irrelevant: it is the
  # flag that stops non-native children coming back as `{"filtered": true}`, in
  # EITHER direction. The guards below are the proof obligation — if a Linux
  # evaluator could not classify `darwinConfigurations`, `macos` comes back with
  # no `forSystems` and the `unclassified` check HARD-FAILS this job. A silent
  # green over a half-covered fleet is not reachable from here.
  legs:
    name: legs
    # HEAVY (see WHO WAITS). Every heavy job carries this exact `if:`; gate's
    # `expect` holds a deliberate second copy, so a drift between them goes red.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
        with:
          extra-conf: |
            extra-substituters = https://kattakath.cachix.org
            extra-trusted-public-keys = kattakath.cachix.org-1:y/w6wnb4ZArdlbfWJ82c81uCXeYgG/sGDUYCszavmEw=

      # Flakes evaluate the git tree, not the working dir — stage everything
      # BEFORE any nix invocation (see .claude/rules/git-purity.md).
      - name: Stage tree (git purity)
        run: git add -A

      # UPSTREAM FIRST (measured 2026-09-21 under the Determinate Nix pinned
      # above). `nix flake show --json --all-systems` answers this off the shelf:
      # it emits a flake-schemas `inventory` whose host children carry
      # `forSystems`, classified by the CONFIGURATION's own system — measured
      # `nixosConfigurations.nixpi -> ["aarch64-linux"]`,
      # `darwinConfigurations.macos -> ["aarch64-darwin"]` — which is precisely
      # the question asked here, so no hand-written `--apply` expression walks
      # `config.nixpkgs.hostPlatform.system`.
      #
      # `--all-systems` is LOAD-BEARING: without it, children belonging to any
      # other system come back as `{"filtered": true}` (measured — both NixOS
      # hosts, on an aarch64-darwin evaluator), so classification would silently
      # follow the RUNNER's arch. The `inventory` shape is flake-schemas, which
      # Determinate Nix emits; upstream Nix emits the flat legacy shape with no
      # such key, which parses to ZERO rows (probed). Neither degradation is
      # assumed away — the two guards below fail the job on each, so a revert to
      # cachix/install-nix-action cannot quietly ship a fleet with no legs.
      - name: Verify one leg per host system
        run: |
          set -euo pipefail

          # A TEMP file, not the workspace: this step is also the thing a human runs
          # by hand to debug the legs, and `> inventory.json` there leaves an
          # untracked file in the repo — which flakes then evaluate around, and which
          # lands in a `git add -A` (measured: it did, on the branch that added this).
          inventory=$(mktemp)
          trap 'rm -f "$inventory"' EXIT
          nix flake show --json --all-systems > "$inventory"

          # `x=$(cmd)` carries the command's exit status, so `set -e` still
          # aborts on a broken eval. `mapfile -t x < <(cmd)` and `cmd | while
          # read` both DISCARD it — never reach for those here.
          rows=$(jq -r '
            def hosts($cat):
              (.inventory[$cat].output.children // {})
              | to_entries[]
              | { name: ($cat + "." + .key), systems: (.value.forSystems // []) };
            [ hosts("nixosConfigurations"), hosts("darwinConfigurations") ][]
            | . as $h
            | if ($h.systems | length) == 0
              then "?\t" + $h.name
              else ($h.systems[] | . + "\t" + $h.name)
              end
          ' "$inventory")

          if [ -z "$rows" ]; then
            echo "::error::no host configuration found — the inventory shape changed (upstream Nix emits the flat legacy shape) and no leg could be verified."
            exit 1
          fi
          unclassified=$(printf '%s\n' "$rows" | awk -F'\t' '$1 == "?" { print $2 }')
          if [ -n "$unclassified" ]; then
            # shellcheck disable=SC2086  # UNQUOTED ON PURPOSE: printf reuses the format
            # per word, so word-splitting here prints ONE error line per host. Quoting
            # would collapse every host into a single %s.
            printf '::error::host %s carries no forSystems — it would be claimed by no leg.\n' $unclassified
            exit 1
          fi
          host_systems=$(printf '%s\n' "$rows" | cut -f1 | sort -u)

          # The legs, read out of THIS workflow: every job that calls the leg
          # workflow, by the `system` it passes. yq-go comes from the flake's own
          # pinned nixpkgs, not the runner image — the same reason the actionlint
          # check does (one less unpinned edge).
          leg_systems=$(nix run --inputs-from . nixpkgs#yq-go -- -r \
            '.jobs[] | select(.uses == "./.github/workflows/nix-ci-impl.yml") | .with.system' \
            .github/workflows/nix-ci.yml | sort -u)
          if [ -z "$leg_systems" ]; then
            echo "::error::no job in nix-ci.yml calls nix-ci-impl.yml — the leg list could not be read, so nothing was verified."
            exit 1
          fi

          fail=0
          for sys in $(comm -23 <(printf '%s\n' "$host_systems") <(printf '%s\n' "$leg_systems")); do
            echo "::error::host configuration(s) declare system '$sys', which no CI leg claims — add a leg job for it in nix-ci.yml."
            fail=1
          done
          for sys in $(comm -13 <(printf '%s\n' "$host_systems") <(printf '%s\n' "$leg_systems")); do
            echo "::error::leg system '$sys' owns no host configuration — a vacuous leg; remove it or add its host."
            fail=1
          done
          printf '%s\n' "$rows" | while IFS=$'\t' read -r sys host; do echo "host $host -> leg $sys"; done
          exit "$fail"

  # One job per leg, each a caller of nix-ci-impl.yml. `fail-fast` no longer
  # applies (no matrix); one leg failing never cancels another. Each leg is its
  # own status check `build (<system>) / leg`; `gate` is the single stable
  # branch-protection anchor, so renaming/adding legs never requires re-anchoring
  # the ruleset. Renaming `gate` silently un-requires it.
  build-linux:
    name: build (aarch64-linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true'
    uses: ./.github/workflows/nix-ci-impl.yml
    # NOT `secrets: inherit`: the token is withheld from merge-queue runs (header,
    # READ from the kattakath Cachix cache). Empty = nix-ci-impl.yml's fork path.
    secrets:
      CACHIX_AUTH_TOKEN: ${{ github.event_name != 'merge_group' && secrets.CACHIX_AUTH_TOKEN || '' }}
    with:
      system: aarch64-linux
      runs-on: ubuntu-24.04-arm
      # EVERY host, darwin's too — pure eval makes the evaluator's arch
      # irrelevant (proof in nix-ci-impl.yml). This is what keeps macos
      # EVALUATED on a gated leg while the darwin leg is advisory.
      eval-categories: nixosConfigurations darwinConfigurations

  # ADVISORY, on PRs only (operator decision, 2026-11-02: darwin is OUT of the
  # queue, with no post-merge belt). `gate` does not need it, so it is visible on
  # the PR and never gates the merge. It runs the FULL darwin leg (all checks +
  # native macos eval): nobody waits on it, so the wider coverage is free. `legs`
  # reads the leg list from the static `uses`/`with.system`, so it still counts
  # this leg.
  build-darwin:
    name: build (aarch64-darwin, advisory)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/nix-ci-impl.yml
    secrets: inherit
    with:
      system: aarch64-darwin
      runs-on: macos-latest
      eval-categories: darwinConfigurations

  # HEAVY: the secret scan and the .claude lint, CALLED so `gate` can need them (a
  # job can only need jobs of its own workflow). They report as
  # `gitleaks / Scan for secrets` and `cclint / Lint .claude config`.
  gitleaks:
    name: gitleaks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true'
    uses: ./.github/workflows/gitleaks.yml

  cclint:
    name: cclint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true'
    uses: ./.github/workflows/claude-config-lint.yml

  # THE REQUIRED CHECK of the shared ruleset (kattakath/.github rulesets/main.json).
  # Never rename it. `!cancelled()` so it runs even when a leg failed; the action
  # fails unless every needed job ended EXACTLY as this event expects: `success`
  # where it should run, `skipped` where it should not. A skipped job reports
  # Success to branch protection, which is why a skippable job is never the
  # required check — this aggregator is. flake-checker and build-darwin are
  # advisory and deliberately absent from `needs`.
  gate:
    name: gate
    if: ${{ !cancelled() }}
    needs: [legs, build-linux, gitleaks, cclint]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: kattakath/.github/actions/gate@3d5ad5b9e04c853dbb0d82446255c9ef9230332a
        with:
          needs: ${{ toJSON(needs) }}
          # A deliberate SECOND copy of the heavy `if:`. If the copies drift, gate
          # goes red in both directions, so a bad edit fails closed.
          expect: >-
            {"legs": ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true' }},
             "build-linux": ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true' }},
             "gitleaks": ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true' }},
             "cclint": ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true' }}}
