# Dependabot version updates.
#
# Scope: GitHub Actions only. This repo SHA-pins every action (SHA + `# vX`
# comment); left to entropy those pins silently rot onto deprecated runtimes
# (e.g. the Node 20 -> Node 24 deprecation). Dependabot keeps them current
# automatically so we never hand-chase Node-runtime warnings again.
#
# Nix flake inputs are NOT managed here — Dependabot has no Nix ecosystem.
# They are bumped by `.github/workflows/update-flake-lock.yml` (scheduled
# `nix flake update` -> automated PR, the FlakeHub input-freshness best
# practice) and, on demand, by the repo's `/update-input` command — both
# regenerate and commit flake.lock.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows only. A COMPOSITE action is its own
    # "manifest location" to Dependabot, so `.github/actions/nix-setup` needs
    # its own entry or its pins never move — measured: 4 human PRs touched that
    # file and ZERO of the 10 grouped dependabot bumps did, leaving it ~3 months
    # behind the workflows on the same two actions.
    directories:
      - "/"
      - "/.github/actions/nix-setup"
    schedule:
      interval: "weekly"
    groups:
      # Collapse every github-actions bump into ONE grouped PR instead of
      # a separate PR per action — one review, one CI run.
      github-actions:
        patterns:
          - "*"
